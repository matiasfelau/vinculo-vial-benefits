name: Publicar imagen en Docker Hub

# Se dispara con un tag de versión (v1.2.3) puesto sobre main. El job test corre las mismas
# pruebas que el CI de PR; si fallan, no se publica nada.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: benefits
          POSTGRES_PASSWORD: benefits
          POSTGRES_DB: benefits
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benefits -d benefits"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://benefits:benefits@localhost:5432/benefits?sslmode=disable
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - name: Descargar código fuente
        # fetch-depth 0: hace falta el historial de main para comprobar que el tag está sobre main.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Verificar que el tag está sobre main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "El tag ${GITHUB_REF_NAME} no apunta a un commit de main: no se publica."
            exit 1
          fi

      - name: Configurar Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"

      - name: Descargar dependencias
        run: go mod download

      - name: Compilar
        run: |
          CGO_ENABLED=0 go build -o benefits ./cmd/api
          CGO_ENABLED=0 go build -o seed ./cmd/seed

      - name: Vet
        run: go vet ./...

      - name: Pruebas unitarias
        run: go test ./... -v -race

      - name: Pruebas de integración
        run: go test ./... -v -race -tags=integration

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Extraer versión del tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compilar y publicar la imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            felaufernandezbottaro/vinculo-vial-benefits:${{ steps.version.outputs.version }}
            felaufernandezbottaro/vinculo-vial-benefits:latest
